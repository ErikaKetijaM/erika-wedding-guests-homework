<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Telegram</title><style>body{font-family:system-ui;margin:3rem;max-width:36rem;color:#18211f}input,button{font:inherit;padding:.75rem;margin:.5rem 0;width:100%;box-sizing:border-box}button{background:#223b34;color:white;border:0;border-radius:.5rem;font-weight:700}p{color:#52615a}</style></head><body><h1>Activate Telegram bot</h1><p>Enter the private setup code stored in Vercel. It is not saved by this page.</p><input id="code" type="password" autocomplete="off" placeholder="Private setup code"><button id="activate">Activate bot</button><p id="result"></p><script>document.querySelector('#activate').onclick=async()=>{const code=document.querySelector('#code').value;const result=document.querySelector('#result');result.textContent='Connecting…';const r=await fetch('/api/setup-telegram',{method:'POST',headers:{Authorization:'Bearer '+code}});const data=await r.json();result.textContent=r.ok?'Connected successfully. You can return to Telegram and send /start.':'Could not connect: '+(data.error||'unknown error');};</script></body></html>
